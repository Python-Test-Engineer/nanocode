[project]
name = "build-your-own-coding-agent-main"
version = "0.1.0"
description = "Nanocode workshop chapters (Build Your Own Coding Agent) with a Rich UI and an OpenRouter brain"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ddgs>=9.16.1",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "rich>=15.0.0",
]

[tool.pytest.ini_options]
# Chapters keep the book's file names, so pytest needs --import-mode=importlib
# (eleven test_nanocode.py) and conftest.py (eleven nanocode/llm/tools/ui
# modules). ch02 is excluded: its test_api.py is a script that calls the API at
# import time, not a test module.
testpaths = ["ch01", "ch03", "ch04", "ch05", "ch06", "ch07", "ch08", "ch09", "ch10", "ch11", "ch12"]
addopts = "--import-mode=importlib"

[dependency-groups]
dev = [
    "markdown>=3.11.2",
    "pymupdf>=2.0",
]
